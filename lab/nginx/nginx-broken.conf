# Fault fixture for the nginx-bad-upstream case: identical to nginx.conf
# except the upstream port (8001 instead of 8000).
events {}

http {
    log_format timed '$remote_addr "$request" $status '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout timed;
    error_log /dev/stderr warn;

    server {
        listen 80;

        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api:8001;
            proxy_read_timeout 30s;
        }
    }
}
