# Fault case registry. Each case defines how to break the lab, the alert an
# on-call engineer would receive, and the canonical root cause used for
# automatic grading.
#
# Grading enums:
#   component:  nginx | api | worker | postgres | redis | other
#   fault_type: process_down | misconfiguration | resource_exhaustion
#             | network | code_bug | other
#
# Design rule: at least half of all cases must be unsolvable from the initial
# evidence dump alone (status + recent logs) so that investigation is required.

cases:
  - id: postgres-down
    description: >-
      Single-hop control case: the postgres container is killed outright.
      The api starts returning 500s on /orders and its logs show connection
      failures, so the cause is visible in the standard evidence dump.
    alert: >-
      [ALERT] HighErrorRate: 5xx responses on GET /orders exceeded 50% over
      the last 2 minutes (normal: 0%). Service: shop API, env: lab.
    injection:
      - docker compose -f lab/docker-compose.yml kill postgres
    settle_seconds: 25
    ground_truth:
      component: postgres
      fault_type: process_down
      accepted_fault_types: [process_down]

  - id: redis-oom
    description: >-
      Multi-hop case: redis is left with a session cache that grew to ~10MB
      and a maxmemory limit of 8MB with noeviction, so every write is denied.
      The api silently falls back to slow synchronous processing (its
      graceful-degradation path), so the only symptom is high latency on
      POST /jobs. No service log contains the root cause; it is discoverable
      only by inspecting redis (INFO memory / errorstats, CONFIG GET).
    alert: >-
      [ALERT] HighLatency: p95 latency on POST /jobs rose above 2s
      (normal: <100ms) over the last 2 minutes. Error rate normal.
      Service: shop API, env: lab.
    injection:
      - >-
        docker compose -f lab/docker-compose.yml exec -T redis sh -c
        'redis-cli config set maxmemory-policy noeviction >/dev/null &&
        for i in $(seq 1 24); do
        head -c 400000 /dev/zero | tr "\0" x | redis-cli -x set cache:session:$i >/dev/null;
        done &&
        redis-cli config set maxmemory 8mb >/dev/null &&
        redis-cli info memory | grep -E "used_memory_human|maxmemory_human|maxmemory_policy"'
    settle_seconds: 30
    ground_truth:
      component: redis
      fault_type: resource_exhaustion
      accepted_fault_types: [resource_exhaustion, misconfiguration]

  - id: pg-connections
    description: >-
      Single-hop control case: a batch client leaks long-running sessions
      (SELECT pg_sleep held open) until every non-reserved postgres slot is
      occupied. The api and worker (regular svc role) fail with a verbatim
      "connection slots are reserved" FATAL in their logs, so the dump names
      the cause. The agent's readonly role holds pg_use_reserved_connections
      (break-glass access), so pg_stat_activity remains queryable and shows
      the leaked batch sessions -- making the attribution (postgres slots
      exhausted by an external client, not an api leak) discoverable.
    alert: >-
      [ALERT] HighErrorRate: 5xx responses on GET /orders exceeded 50% over
      the last 2 minutes (normal: 0%). Service: shop API, env: lab.
    injection:
      - >-
        docker compose -f lab/docker-compose.yml exec -dT postgres sh -c
        'for wave in 1 2 3; do
        for i in $(seq 1 40); do
        psql -U batch -d shop -Atc "SELECT pg_sleep(3600)" </dev/null >/dev/null 2>&1 &
        done; sleep 3; done; wait'
    settle_seconds: 25
    ground_truth:
      component: postgres
      fault_type: resource_exhaustion
      accepted_fault_types: [resource_exhaustion]

  - id: api-dns
    description: >-
      Misleading-dump case: the api container's resolver is pointed at a
      blackhole nameserver. Fresh postgres connections fail with "Temporary
      failure in name resolution" -- the same api-log signature as
      postgres-down -- but compose ps shows postgres healthy and long-lived
      redis connections keep working, so POST /jobs is unaffected. The dump
      suggests postgres; direct checks (psql works from inside the network,
      postgres healthy) exonerate it and point at the api's own name
      resolution. Alert text is intentionally identical to postgres-down.
    alert: >-
      [ALERT] HighErrorRate: 5xx responses on GET /orders exceeded 50% over
      the last 2 minutes (normal: 0%). Service: shop API, env: lab.
    injection:
      - >-
        docker compose -f lab/docker-compose.yml exec -T api sh -c
        'echo "nameserver 10.255.255.1" > /etc/resolv.conf'
    settle_seconds: 25
    ground_truth:
      component: api
      fault_type: network
      accepted_fault_types: [network, misconfiguration]

  - id: worker-oom
    description: >-
      Multi-hop case: the worker container's memory limit is dropped to 20MB
      at runtime, far below the Python process footprint, so the kernel
      OOM-kills it on startup and restart:on-failure turns it into a crash
      loop. Worker logs show only clean startup lines (SIGKILL leaves no
      trace), so the dump shows a restarting service with no error; the cause
      (OOMKilled=true, Memory=20971520) is visible only via docker inspect.
    alert: >-
      [ALERT] QueueBacklog: redis list 'jobs' depth is growing steadily and
      no new reports have been written for several minutes (normal:
      continuous). Service: report worker, env: lab.
    injection:
      - >-
        docker update --memory 20m --memory-swap 20m
        $(docker compose -f lab/docker-compose.yml ps -q worker)
    settle_seconds: 40
    ground_truth:
      component: worker
      fault_type: resource_exhaustion
      accepted_fault_types: [resource_exhaustion, misconfiguration]

  - id: worker-wrong-queue
    description: >-
      Multi-hop config-drift case: the worker is redeployed consuming
      'jobs-reporting' while the api still enqueues to 'jobs'. The worker is
      Up, healthy and silent (BRPOP on an empty list), producing no errors
      anywhere; the queue backs up. The drift is discoverable only by
      comparing the worker's QUEUE_KEY env (docker inspect) or redis key
      state (llen jobs growing, jobs-reporting absent) with the intended
      queue. Alert text is intentionally identical to worker-oom.
    alert: >-
      [ALERT] QueueBacklog: redis list 'jobs' depth is growing steadily and
      no new reports have been written for several minutes (normal:
      continuous). Service: report worker, env: lab.
    injection:
      - >-
        WORKER_QUEUE_KEY=jobs-reporting
        docker compose -f lab/docker-compose.yml up -d worker
    settle_seconds: 40
    ground_truth:
      component: worker
      fault_type: misconfiguration
      accepted_fault_types: [misconfiguration]

  # --- eval set v3 additions: probe-blind faults (connectivity is fine) ---

  - id: nginx-bad-upstream
    description: >-
      Probe-blind control case: nginx is redeployed with a config that
      proxies to api:8001 instead of api:8000, so every proxied route returns
      502 while the api itself is healthy. DNS and TCP from nginx to api:8000
      are fine, so probe_connectivity exonerates the network; nginx's error
      log names the refused connection to port 8001, so the dump suffices for
      a careful reader.
    alert: >-
      [ALERT] HighErrorRate: 502 responses on all routes through the edge
      exceeded 90% over the last 2 minutes (normal: 0%). Service: shop edge
      (nginx), env: lab.
    injection:
      - >-
        NGINX_CONF=./nginx/nginx-broken.conf
        docker compose -f lab/docker-compose.yml up -d nginx
    settle_seconds: 25
    ground_truth:
      component: nginx
      fault_type: misconfiguration
      accepted_fault_types: [misconfiguration]

  - id: redis-auth
    description: >-
      Probe-blind case: requirepass is set on redis at runtime and existing
      client connections are killed, so every unauthenticated client --
      api, worker, and the agent's own redis-cli -- gets NOAUTH. TCP to
      redis:6379 stays fine. The api silently falls back to slow synchronous
      processing (latency on POST /jobs, same alert as redis-oom); the worker
      logs NOAUTH tracebacks, so the dump names the cause for a careful
      reader. Alert text is intentionally identical to redis-oom.
    alert: >-
      [ALERT] HighLatency: p95 latency on POST /jobs rose above 2s
      (normal: <100ms) over the last 2 minutes. Error rate normal.
      Service: shop API, env: lab.
    injection:
      - >-
        docker compose -f lab/docker-compose.yml exec -T redis sh -c
        'redis-cli config set requirepass lab_incident_pw >/dev/null &&
        redis-cli -a lab_incident_pw --no-auth-warning client kill type normal
        >/dev/null; true'
    settle_seconds: 30
    ground_truth:
      component: redis
      fault_type: misconfiguration
      accepted_fault_types: [misconfiguration]

  - id: pg-lock
    description: >-
      Multi-hop, probe-blind, dump-silent case: a stale admin transaction
      holds ACCESS EXCLUSIVE on the orders table (BEGIN; LOCK TABLE;
      pg_sleep in one session). GET /orders hangs until client timeouts and
      the worker stalls mid-job, but NO service logs an error -- requests
      that never complete never get log lines. All connectivity is fine.
      The blocker is visible only via SQL: pg_stat_activity shows the
      LOCK TABLE session and the waiting queries (wait_event_type=Lock).
    alert: >-
      [ALERT] HighLatency: GET /orders requests are hanging past the 15s
      client timeout (normal: ~20ms); POST /jobs and other endpoints normal.
      Service: shop API, env: lab.
    injection:
      - >-
        docker compose -f lab/docker-compose.yml exec -dT postgres sh -c
        'psql -U app -d shop -c
        "BEGIN; LOCK TABLE orders IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(3600);"
        </dev/null >/dev/null 2>&1 & wait'
    settle_seconds: 30
    ground_truth:
      component: postgres
      fault_type: other
      accepted_fault_types: [other, resource_exhaustion]

  - id: api-cpu-limit
    description: >-
      Multi-hop, probe-blind, dump-silent case: the api container's CPU
      quota is dropped to 0.01 cores at runtime. Every endpoint degrades to
      multi-second responses, but no service logs an error -- the api's own
      access log just shows large durations. Connectivity is fine. The cause
      (NanoCpus in HostConfig) is visible only via docker inspect api /
      docker stats.
    alert: >-
      [ALERT] HighLatency: latency degraded more than 10x on ALL api
      endpoints (multi-second responses, normal <100ms). Error rate normal.
      Service: shop API, env: lab.
    injection:
      - >-
        docker update --cpus 0.01
        $(docker compose -f lab/docker-compose.yml ps -q api)
    settle_seconds: 30
    ground_truth:
      component: api
      fault_type: resource_exhaustion
      accepted_fault_types: [resource_exhaustion, misconfiguration]
